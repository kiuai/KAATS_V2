services:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      servicebus-emulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - kaats

  # ── Worker ─────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
    networks:
      - kaats

  # ── Scheduler ──────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - kaats

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api
    networks:
      - kaats

  # ── Azure SQL (local dev) ──────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: KaatsDevPass!2026
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "KaatsDevPass!2026", "-C",
             "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - kaats

  # ── Azurite (Blob + Queue + Table emulator) ────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - kaats

  # ── Service Bus emulator ───────────────────────────────────────────────────
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: KaatsDevPass!2026
    ports:
      - "5672:5672"
      - "9354:9354"
    volumes:
      - ./servicebus-config/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - kaats

  # ── DB init (creates database + runs Alembic) ──────────────────────────────
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["/bin/bash", "/app/scripts/db_init.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - kaats

volumes:
  sqldata:
  azurite_data:

networks:
  kaats:
    driver: bridge
