[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaats-backend"
version = "1.0.0"
description = "KAATS — KIU AI Agentic Test System backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115,<0.116",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13",
    "aioodbc>=0.5",
    "pyodbc>=5.1",

    # Validation & config
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",

    # Azure SDKs
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-servicebus>=7.12",
    "azure-storage-blob>=12.20",
    "azure-cosmos>=4.7",
    "azure-communication-email>=1.0",

    # AI & LangChain
    "openai>=1.30",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "tiktoken>=0.7",

    # Auth
    "msal>=1.29",
    "python-jose[cryptography]>=3.3",

    # Browser automation
    "playwright>=1.44",

    # Evidence & reporting
    "Pillow>=10.3",
    "reportlab>=4.2",

    # Scheduling & retry
    "croniter>=2.0",
    "pytz>=2024.1",
    "tenacity>=8.3",

    # HTTP & utilities
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.2",

    # Rate limiting
    "slowapi>=0.1.9",

    # Billing
    "stripe>=10.0",

    # Observability — OpenTelemetry
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-passlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI Depends() in default args is intentional
    "B904",   # raise-without-from-cause — non-critical style
    "B905",   # zip() without strict — not critical
    "F821",   # undefined-name — caused by TYPE_CHECKING guards; not a runtime issue
    "SIM102", # nested if — style preference
    "SIM105", # contextlib.suppress style preference
    "SIM108", # ternary operator style preference
    "UP042",  # use StrEnum — prefer explicit str+Enum for JSON serialization clarity
    "UP046",  # type parameter syntax for Generic subclass — Pydantic v2 compatibility
    "UP047",  # type parameter syntax — Python 3.12+ only, breaks 3.10/3.11 compat
    "TC001",  # move stdlib import to TYPE_CHECKING block
    "TC002",  # move third-party import to TYPE_CHECKING block
    "TC003",  # move first-party import to TYPE_CHECKING block
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: pure-Python unit test, no I/O",
    "integration: test against real DB or full ASGI app",
    "e2e: end-to-end browser/agent test",
    "slow: test takes more than a few seconds",
    "security: security-focused test",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*"]
