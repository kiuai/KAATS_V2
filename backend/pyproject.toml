[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaats-backend"
version = "1.0.0"
description = "KAATS — KIU AI Agentic Test System backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115,<0.116",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13",
    "aioodbc>=0.5",
    "pyodbc>=5.1",

    # Validation & config
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",

    # Azure SDKs
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-servicebus>=7.12",
    "azure-storage-blob>=12.20",
    "azure-cosmos>=4.7",

    # AI & LangChain
    "openai>=1.30",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "tiktoken>=0.7",

    # Auth
    "msal>=1.29",
    "python-jose[cryptography]>=3.3",

    # Browser automation
    "playwright>=1.44",

    # Evidence & reporting
    "Pillow>=10.3",
    "reportlab>=4.2",

    # Scheduling & retry
    "croniter>=2.0",
    "tenacity>=8.3",

    # HTTP & utilities
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-passlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*"]
