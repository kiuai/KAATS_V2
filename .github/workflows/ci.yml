# ─────────────────────────────────────────────────────────────────────────────
# KAATS — Continuous Integration
# Runs on every push and on PRs targeting main.
# All four jobs run in parallel; a PR cannot be merged until all pass.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# ─────────────────────────────────────────────────────────────────────────────
# Backend — lint, type-check
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-quality:
    name: Backend quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install quality tools
        working-directory: backend
        run: pip install ruff mypy pydantic[mypy] sqlalchemy[mypy] types-passlib

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app/

      - name: mypy
        working-directory: backend
        run: mypy app/ --strict --ignore-missing-imports

# ─────────────────────────────────────────────────────────────────────────────
# Backend — tests with real SQL Server
# ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest + coverage)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: KaatsTestPass!2026
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P KaatsTestPass!2026 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-min-32-chars-padding00
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      AZURE_CLIENT_SECRET: ci-not-used
      AZURE_OPENAI_ENDPOINT: https://fake.openai.azure.com/
      AZURE_OPENAI_API_KEY: ci-fake-key
      AZURE_OPENAI_DEPLOYMENT_NAME: gpt-4o
      AZURE_SQL_SERVER: localhost,1433
      AZURE_SQL_DATABASE: kaats_test
      AZURE_SQL_USERNAME: sa
      AZURE_SQL_PASSWORD: KaatsTestPass!2026
      DATABASE_URL: "mssql+pyodbc://sa:KaatsTestPass%212026@localhost,1433/kaats_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&Encrypt=yes"
      AZURE_COSMOS_ENDPOINT: https://fake.documents.azure.com:443/
      AZURE_COSMOS_KEY: Y2ktZmFrZS1jb3Ntb3Mta2V5LXBhZGRpbmctcGFkZGluZy1wYWRkaW5nPT0=
      AZURE_COSMOS_DATABASE: kaats_test
      AZURE_SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://fake.servicebus.windows.net/;SharedAccessKeyName=fake;SharedAccessKey=Y2ktZmFrZQ==
      AZURE_STORAGE_ACCOUNT_NAME: fakeaccount
      AZURE_STORAGE_ACCOUNT_KEY: Y2ktZmFrZS1zdG9yYWdlLWtleS1wYWRkaW5nLXBhZGRpbmctcGFkZGluZw==

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor \
            -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] \
            https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends \
            msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        working-directory: backend
        run: playwright install chromium --with-deps

      - name: Create test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 -U sa -P KaatsTestPass!2026 -C \
            -Q "CREATE DATABASE kaats_test"

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ \
            -m "unit or integration" \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Frontend — lint, type-check, unit tests
# ─────────────────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend quality (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type-check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Security — SAST, SCA, CodeQL
# ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security scans (Bandit + pip-audit + npm audit + CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Python SAST ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python deps + security tools
        working-directory: backend
        run: pip install -e . bandit pip-audit

      - name: Bandit SAST
        working-directory: backend
        run: |
          bandit -r app/ \
            -f json -o bandit-results.json \
            -ll \
            || true   # non-zero exit captured in SARIF upload below

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: backend/bandit-results.json

      - name: pip-audit SCA
        working-directory: backend
        run: pip-audit -r <(pip freeze) --ignore-vuln PYSEC-2024-47 || true

      # ── JavaScript SCA ───────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install (for audit)
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      # ── CodeQL ───────────────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python,javascript
