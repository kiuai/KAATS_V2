# ─────────────────────────────────────────────────────────────────────────────
# KAATS — Database Migration Check
# Runs on push to main and on PRs targeting main.
# Validates:
#   1. No unapplied migrations (alembic check)
#   2. All migration files have a downgrade() function
#   3. Destructive operations (DROP COLUMN/TABLE, TRUNCATE) get a warning
#      and require explicit acknowledgement via PR label "migration:destructive"
# ─────────────────────────────────────────────────────────────────────────────

name: Database Migration Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/app/models/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/app/models/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  migration-check:
    name: Validate migrations
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: KaatsTestPass!2026
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P KaatsTestPass!2026 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-min-32-chars-padding00
      ALLOWED_ORIGINS: http://localhost:5173
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      AZURE_CLIENT_SECRET: ci-not-used
      AZURE_OPENAI_ENDPOINT: https://fake.openai.azure.com/
      AZURE_OPENAI_API_KEY: ci-fake-key
      AZURE_OPENAI_DEPLOYMENT_NAME: gpt-4o
      AZURE_SQL_SERVER: localhost,1433
      AZURE_SQL_DATABASE: kaats_migration_check
      AZURE_SQL_USERNAME: sa
      AZURE_SQL_PASSWORD: KaatsTestPass!2026
      AZURE_COSMOS_ENDPOINT: https://fake.documents.azure.com:443/
      AZURE_COSMOS_KEY: Y2ktZmFrZS1jb3Ntb3Mta2V5LXBhZGRpbmctcGFkZGluZy1wYWRkaW5nPT0=
      AZURE_COSMOS_DATABASE: kaats_test
      AZURE_SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://fake.servicebus.windows.net/;SharedAccessKeyName=fake;SharedAccessKey=Y2ktZmFrZQ==
      AZURE_STORAGE_ACCOUNT_NAME: fakeaccount
      AZURE_STORAGE_ACCOUNT_KEY: Y2ktZmFrZS1zdG9yYWdlLWtleS1wYWRkaW5nLXBhZGRpbmctcGFkZGluZw==

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor \
            -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] \
            https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends \
            msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Install Python deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Create check database
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 -U sa -P KaatsTestPass!2026 -C \
            -Q "CREATE DATABASE kaats_migration_check"

      # ── 1. Apply all migrations ────────────────────────────────────────
      - name: Apply migrations (alembic upgrade head)
        id: upgrade
        working-directory: backend
        run: alembic upgrade head

      # ── 2. Check no unapplied migrations ──────────────────────────────
      - name: Check for unapplied migrations
        id: alembic-check
        working-directory: backend
        run: |
          OUTPUT=$(alembic check 2>&1 || true)
          echo "${OUTPUT}"
          if echo "${OUTPUT}" | grep -qi "unapplied migration"; then
            echo "has_unapplied=true" >> "$GITHUB_OUTPUT"
            echo "::error::There are unapplied Alembic migrations. Run 'alembic upgrade head' locally and commit the generated migration file."
          else
            echo "has_unapplied=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 3. Validate downgrade() functions exist ────────────────────────
      - name: Validate downgrade() functions
        id: downgrade-check
        working-directory: backend
        run: |
          python - <<'EOF'
          import pathlib, sys, ast

          migration_dir = pathlib.Path("migrations/versions")
          if not migration_dir.exists():
              print("No migrations/versions directory found — skipping")
              sys.exit(0)

          missing = []
          for f in sorted(migration_dir.glob("*.py")):
              src = f.read_text()
              try:
                  tree = ast.parse(src)
              except SyntaxError:
                  print(f"WARN: could not parse {f.name}")
                  continue
              funcs = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
              if "downgrade" not in funcs:
                  missing.append(f.name)

          if missing:
              print(f"::error::The following migration files are missing a downgrade() function:")
              for m in missing:
                  print(f"  - {m}")
              sys.exit(1)
          else:
              print(f"All {len(list(migration_dir.glob('*.py')))} migration files have downgrade()")
          EOF

      # ── 4. Detect destructive operations ──────────────────────────────
      - name: Detect destructive SQL operations
        id: destructive-check
        working-directory: backend
        run: |
          python - <<'PYEOF'
          import pathlib, re, sys, json

          DESTRUCTIVE_PATTERNS = [
              (r'\bdrop\s+column\b',  'DROP COLUMN'),
              (r'\bdrop\s+table\b',   'DROP TABLE'),
              (r'\btruncate\b',       'TRUNCATE'),
              (r'\bdrop\s+index\b',   'DROP INDEX (may lock table)'),
          ]

          migration_dir = pathlib.Path("migrations/versions")
          if not migration_dir.exists():
              sys.exit(0)

          findings = {}
          for f in sorted(migration_dir.glob("*.py")):
              src = f.read_text().lower()
              matched = []
              for pattern, label in DESTRUCTIVE_PATTERNS:
                  if re.search(pattern, src, re.IGNORECASE):
                      matched.append(label)
              if matched:
                  findings[f.name] = matched

          if findings:
              print("::warning::Destructive operations detected in migration files:")
              for fname, ops in findings.items():
                  print(f"  {fname}: {', '.join(ops)}")
              # Write to file for the next step to consume
              with open("destructive-findings.json", "w") as fp:
                  json.dump(findings, fp, indent=2)
              sys.exit(2)  # special exit code — warning, not hard failure
          else:
              print("No destructive operations detected")
          PYEOF
          EXIT_CODE=$?
          if [[ "${EXIT_CODE}" -eq 2 ]]; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          elif [[ "${EXIT_CODE}" -ne 0 ]]; then
            exit "${EXIT_CODE}"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. On PR: require label for destructive migrations ─────────────
      - name: Check for approval label on destructive migrations
        if: >-
          github.event_name == 'pull_request' &&
          steps.destructive-check.outputs.has_destructive == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const approved = labels.includes('migration:destructive');

            // Always post/update a comment about the finding
            const findings = JSON.parse(
              require('fs').readFileSync('backend/destructive-findings.json', 'utf8')
            );
            const findingText = Object.entries(findings)
              .map(([f, ops]) => `- \`${f}\`: ${ops.join(', ')}`)
              .join('\n');

            const body = approved
              ? [
                  '## ⚠️ Destructive Migration — Approved',
                  '',
                  'This PR contains destructive migration operations and has been approved with the `migration:destructive` label.',
                  '',
                  '**Findings:**',
                  findingText,
                  '',
                  '> ✅ CI will pass because the label is present.',
                ].join('\n')
              : [
                  '## 🚨 Destructive Migration Detected',
                  '',
                  'This PR contains destructive database operations that require explicit approval.',
                  '',
                  '**Findings:**',
                  findingText,
                  '',
                  '### Required action',
                  'Add the label **`migration:destructive`** to this PR to acknowledge the risk and allow CI to pass.',
                  '',
                  '> ❌ CI is currently blocked until the label is added.',
                ].join('\n');

            // Upsert the comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Destructive Migration')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (!approved) {
              core.setFailed(
                'Destructive migration detected. Add the "migration:destructive" label to approve.'
              );
            }

      - name: Summary
        if: always()
        run: |
          echo "### Migration Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upgrade applied | ${{ steps.upgrade.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| No unapplied migrations | ${{ steps.alembic-check.outputs.has_unapplied == 'false' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| All have downgrade() | ${{ steps.downgrade-check.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Destructive ops | ${{ steps.destructive-check.outputs.has_destructive == 'true' && '⚠️ found' || '✅ none' }} |" >> "$GITHUB_STEP_SUMMARY"
