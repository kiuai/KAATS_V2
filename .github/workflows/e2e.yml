# ─────────────────────────────────────────────────────────────────────────────
# KAATS — End-to-end tests (Playwright)
#
# Triggered on:
#   - Pushes to main (post-merge regression gate)
#   - Manual workflow_dispatch (ad-hoc runs)
#
# The job boots the full docker-compose stack (API + frontend + SQL Server +
# Azurite + Service Bus emulator), waits for all services to be healthy, then
# runs the Playwright test suite.  The worker and scheduler containers are
# intentionally excluded — E2E tests only need the API and frontend.
#
# Artifacts:
#   - playwright-report/ (HTML report, retained 30 days)
#   - playwright-results/ (traces + videos for failing tests)
# ─────────────────────────────────────────────────────────────────────────────

name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend URL (leave blank for local docker-compose)'
        required: false
        default: ''
      api_url:
        description: 'API URL (leave blank for local docker-compose)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
      # Used by docker-compose.override.yml / .env defaults
      ENVIRONMENT: development
      SECRET_KEY: e2e-secret-key-min-32-chars-padding
      ALLOWED_ORIGINS: http://localhost:5173
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      AZURE_CLIENT_SECRET: e2e-not-used
      AZURE_OPENAI_ENDPOINT: https://fake.openai.azure.com/
      AZURE_OPENAI_API_KEY: e2e-fake-key
      AZURE_OPENAI_DEPLOYMENT_NAME: gpt-4o
      AZURE_SQL_SERVER: localhost,1433
      AZURE_SQL_DATABASE: kaats_e2e
      AZURE_SQL_USERNAME: sa
      AZURE_SQL_PASSWORD: KaatsE2EPass!2026
      AZURE_COSMOS_ENDPOINT: https://fake.documents.azure.com:443/
      AZURE_COSMOS_KEY: ZTJ0ZXN0LWZha2UtY29zbW9zLWtleXBhZGRpbmctcGFkZGluZw==
      AZURE_COSMOS_DATABASE: kaats_e2e
      AZURE_SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://fake.servicebus.windows.net/;SharedAccessKeyName=fake;SharedAccessKey=ZTJ0ZXN0ZmFrZQ==
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_STORAGE_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KQttkPqfMfMQ==
      ACS_CONNECTION_STRING: ""
      ACS_SENDER_ADDRESS: ""
      FRONTEND_BASE_URL: http://localhost:5173
      OPENAPI_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      # ── Install SQL Server ODBC driver (needed for db-init container build) ──
      - name: Install ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] \
            https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends \
            msodbcsql18 mssql-tools18 unixodbc-dev

      # ── Write .env for docker-compose ──────────────────────────────────────
      - name: Write .env
        run: |
          cat > .env << 'EOF'
          ENVIRONMENT=development
          SECRET_KEY=e2e-secret-key-min-32-chars-padding
          ALLOWED_ORIGINS=http://localhost:5173
          AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000
          AZURE_CLIENT_ID=00000000-0000-0000-0000-000000000001
          AZURE_CLIENT_SECRET=e2e-not-used
          AZURE_OPENAI_ENDPOINT=https://fake.openai.azure.com/
          AZURE_OPENAI_API_KEY=e2e-fake-key
          AZURE_OPENAI_DEPLOYMENT_NAME=gpt-4o
          AZURE_SQL_SERVER=sqlserver,1433
          AZURE_SQL_DATABASE=kaats_e2e
          AZURE_SQL_USERNAME=sa
          AZURE_SQL_PASSWORD=KaatsE2EPass!2026
          AZURE_COSMOS_ENDPOINT=https://fake.documents.azure.com:443/
          AZURE_COSMOS_KEY=ZTJ0ZXN0LWZha2UtY29zbW9zLWtleXBhZGRpbmctcGFkZGluZw==
          AZURE_COSMOS_DATABASE=kaats_e2e
          AZURE_SERVICE_BUS_CONNECTION_STRING=Endpoint=sb://fake.servicebus.windows.net/;SharedAccessKeyName=fake;SharedAccessKey=ZTJ0ZXN0ZmFrZQ==
          AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
          AZURE_STORAGE_ACCOUNT_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KQttkPqfMfMQ==
          ACS_CONNECTION_STRING=
          ACS_SENDER_ADDRESS=
          FRONTEND_BASE_URL=http://localhost:5173
          OPENAPI_ENABLED=true
          EOF

      # ── Start services (API + frontend only; no worker/scheduler) ──────────
      - name: Start docker-compose services
        run: |
          docker compose up -d sqlserver azurite servicebus-emulator
          echo "Waiting for SQL Server to be healthy…"
          for i in $(seq 1 30); do
            if docker compose ps sqlserver | grep -q "healthy"; then break; fi
            sleep 5
          done
          # Create the E2E database
          docker compose exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "KaatsE2EPass!2026" -C \
            -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name='kaats_e2e') CREATE DATABASE kaats_e2e"
          # Build and start API + frontend
          docker compose up -d --build api frontend

      # ── Wait for API health ────────────────────────────────────────────────
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/live || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (attempt $i)"
              break
            fi
            echo "Attempt $i: status=$STATUS, retrying in 5s…"
            sleep 5
          done
          # Final check
          curl -f http://localhost:8000/health/live || \
            (docker compose logs api && exit 1)

      # ── Wait for frontend ──────────────────────────────────────────────────
      - name: Wait for frontend to serve
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            if [ "$STATUS" = "200" ]; then echo "Frontend ready"; break; fi
            sleep 3
          done

      # ── Run Alembic migrations ─────────────────────────────────────────────
      - name: Run database migrations
        run: |
          docker compose run --rm \
            -e AZURE_SQL_DATABASE=kaats_e2e \
            api alembic upgrade head

      # ── Node + Playwright ──────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # ── Run E2E tests ──────────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:5173' }}
          API_URL:  ${{ github.event.inputs.api_url  || 'http://localhost:8000' }}
        run: npm test

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright results (traces/videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results/
          retention-days: 7

      - name: Print docker-compose logs on failure
        if: failure()
        run: docker compose logs --tail=100 api frontend
