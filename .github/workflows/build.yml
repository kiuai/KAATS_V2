# ─────────────────────────────────────────────────────────────────────────────
# KAATS — Build & Push Container Images
# Runs after CI passes on main. Builds api, worker, scheduler, frontend.
# Uses OIDC (no stored credentials). Signs images with Cosign.
# Generates SBOM with Syft. Outputs image tags for downstream workflows.
# ─────────────────────────────────────────────────────────────────────────────

name: Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # never cancel a build in progress — it would leave ACR inconsistent

permissions:
  contents: read
  id-token: write             # OIDC token for Azure + Cosign keyless signing
  packages: write
  attestations: write

jobs:
  # ── Guard: only run if CI passed ────────────────────────────────────────────
  check-ci:
    name: Check CI outcome
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding to build"

  # ─────────────────────────────────────────────────────────────────────────
  # Build all images
  # ─────────────────────────────────────────────────────────────────────────
  build-images:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: check-ci
    outputs:
      api-tag:       ${{ steps.meta-api.outputs.tags }}
      worker-tag:    ${{ steps.meta-worker.outputs.tags }}
      scheduler-tag: ${{ steps.meta-scheduler.outputs.tags }}
      frontend-tag:  ${{ steps.meta-frontend.outputs.tags }}
      image-tag:     ${{ steps.short-sha.outputs.sha }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: ''
          - name: worker
            context: ./backend
            dockerfile: ./backend/Dockerfile.worker
            target: ''
          - name: scheduler
            context: ./backend
            dockerfile: ./backend/Dockerfile.scheduler
            target: ''
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── OIDC login to Azure → ACR ──────────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      # ── Image metadata ─────────────────────────────────────────────────
      - name: Extract Docker metadata (${{ matrix.name }})
        id: meta-${{ matrix.name }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/kaats/${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build and push ─────────────────────────────────────────────────
      - name: Build & push ${{ matrix.name }}
        id: build-${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}${{ steps.meta-worker.outputs.tags }}${{ steps.meta-scheduler.outputs.tags }}${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/kaats/${{ matrix.name }}:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/kaats/${{ matrix.name }}:cache,mode=max
          provenance: true
          sbom: true

      # ── Cosign keyless signing ─────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        env:
          DIGEST: ${{ steps.build-api.outputs.digest }}${{ steps.build-worker.outputs.digest }}${{ steps.build-scheduler.outputs.digest }}${{ steps.build-frontend.outputs.digest }}
          IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/kaats/${{ matrix.name }}
        run: |
          DIGEST_VALUE=""
          case "${{ matrix.name }}" in
            api)       DIGEST_VALUE="${{ steps.build-api.outputs.digest }}" ;;
            worker)    DIGEST_VALUE="${{ steps.build-worker.outputs.digest }}" ;;
            scheduler) DIGEST_VALUE="${{ steps.build-scheduler.outputs.digest }}" ;;
            frontend)  DIGEST_VALUE="${{ steps.build-frontend.outputs.digest }}" ;;
          esac
          cosign sign --yes "${IMAGE}@${DIGEST_VALUE}"

      # ── SBOM with Syft ─────────────────────────────────────────────────
      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/kaats/${{ matrix.name }}:${{ steps.short-sha.outputs.sha }}"
          syft "${IMAGE}" -o spdx-json > sbom-${{ matrix.name }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # Aggregate job — passes image-tag to downstream deploy workflows
  # ─────────────────────────────────────────────────────────────────────────
  summarise:
    name: Build summary
    runs-on: ubuntu-latest
    needs: build-images
    outputs:
      image-tag: ${{ needs.build-images.outputs.image-tag }}
    steps:
      - run: |
          echo "All images pushed with tag: ${{ needs.build-images.outputs.image-tag }}"
          echo "ACR: ${{ secrets.ACR_LOGIN_SERVER }}"
